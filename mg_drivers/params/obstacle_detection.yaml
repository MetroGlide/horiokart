obstacle_detection_3d_node:
  ros__parameters:
    # Step 2: ダウンサンプリング
    voxel_leaf_size: 0.05          # [m]

    # Step 2: CropBox
    cropbox_x_min: 0.0             # [m]
    cropbox_x_max: 3.0             # [m]
    cropbox_y_min: -0.75           # [m]
    cropbox_y_max: 0.75            # [m]
    cropbox_z_min: -0.1            # [m]
    cropbox_z_max: 1.0             # [m]

    # Step 3: 2.5D ΔZ評価
    grid_size: 0.05                # [m] グリッド解像度
    delta_z_threshold: 0.15        # [m] 障害物判定閾値

    # Step 4: Radius Outlier Removal
    ror_radius_search: 0.2         # [m]
    ror_min_neighbors: 3           # [個]

    # Step 4: Euclidean Cluster Extraction
    cluster_tolerance: 0.3         # [m]
    min_cluster_size: 10           # [点]
    max_cluster_size: 1000         # [点]
