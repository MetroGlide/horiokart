/**:
  ros__parameters:
    topics:
      scan: "/scan_top_lidar"
      odom: "/odom"

    map:
      resolution: 0.05
      expansion_margin: 100.0
      publish_hz: 1.0

    keyframe:
      min_translation: 1.0
      min_rotation: 0.1

    # スキャンマッチング（フロントエンド）設定
    scan_matching:
      enabled: true
      type: "ndt" # "icp" | "ndt"
      reference: "scan_to_local_map" # "scan_to_scan" | "scan_to_local_map"
      max_failure_streak: 5
      icp:
        max_iterations: 100
        tolerance: 0.00001
        max_correspondence_dist: 1.0
      ndt:
        cell_size: 1.0
      local_map:
        window: 30
        radius: 30.0

    # ループクロージャ設定
    loop_closure:
      enabled: true
      search_radius: 2.0
      min_node_gap: 50
      max_failure_streak: 3
      matcher_type: "icp"
      icp:
        max_iterations: 100
        tolerance: 0.00001
        max_correspondence_dist: 1.0
      ndt:
        cell_size: 1.0
      max_dyaw_deg: 145.0
      crossing_reject_deg: 45.0
      submap_radius: 5.0
      max_score: 0.0

    # GNSS設定
    gnss:
      enabled: true
      mode: "integrated" # "integrated" | "split_align"
      source: "navpvt" # "navsat_fix" | "navpvt"
      topics:
        fix: "/gps/fix"
        navpvt: "/navpvt"
      navpvt_hacc_scale: 1.0
      validation:
        max_time_delta_s: 5.0
        max_sigma_m: 5.0
        missing_grace_frames: 30
      anchor:
        min_fix_status: 0
        sigma_m: 0.05
        init_yaw_sigma_rad: 10.0
        init_distance_m: 2.0
      sigma:
        fix_m: 0.02
        float_m: 0.5
        noise_xy_m: 3.0
        factor_yaw_variance: 100000000.0
      aligner:
        type: "precision_weighted"
        kinematic_min_speed_ms: 0.5

    # バックエンド最適化設定
    optimization:
      backend: "gtsam" # "isam2" | "gtsam"
      incremental: true
      batch: true
      batch_trigger:
        mode: "event"
        on_loop_close: true
        every_n_nodes: 100
        on_finalize: true
      optimize_every_n_loops: 3
      rerender_threshold_m: 0.1
      isam2:
        relinearize_threshold: 0.1

slam_gnss_2d_offline_node:
  ros__parameters:
    offline_step_hz: 0.0 # 可視化速度 [Hz]。0 以下で最大速度

