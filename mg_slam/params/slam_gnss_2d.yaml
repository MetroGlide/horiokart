/**:
  ros__parameters:
    scan_topic: /scan_top_lidar
    odom_topic: /odom

    map_resolution: 0.05
    map_expansion_margin: 100.0
    # min_translation: 0.3
    min_translation: 1.0
    min_rotation: 0.1
    map_publish_hz: 1.0

    # pose_graph_builder: loop_closure # "odom_only" | "scan_matching" | "loop_closure"
    pose_graph_builder: scan_matching # "odom_only" | "scan_matching" | "loop_closure"
    scan_matcher_type: ndt # "icp" | "ndt"
    scan_reference: scan_to_local_map # "scan_to_scan" | "scan_to_local_map"

    icp_max_iterations: 100
    icp_tolerance: 0.00001
    icp_max_correspondence_dist: 1.0

    ndt_cell_size: 1.0

    local_map_window: 30
    local_map_radius: 30.0

    matcher_max_failure_streak: 5 # この回数連続失敗で odom フォールバック

    # ループクロージャ設定（pose_graph_builder: loop_closure のとき使用）
    loop_closure_search_radius: 2.0 # ループ候補ノード間距面間値 [m]
    loop_closure_min_node_gap: 50 # ループ候補の最小ノード間隔
    loop_closure_max_failure_streak: 3 # ループ検証連続失敗上限
    optimize_every_n_loops: 3 # N本ループ辺追加ごとに最適化
    loop_closure_matcher_type: icp # "icp" | "ndt". NDTは180°対称false positiveリスクがあるためICP推奨
    loop_closure_max_dyaw_deg: 145.0 # ループ辺のdyaw絶対値上限 [deg]. Uターンループ（最大~142°）を許容しつつ180°対称誤検出（~151°）を拒否
    loop_closure_crossing_reject_deg: 45.0 # パス交差拒否閾値 [deg]. |dyaw| が [this, 180-this] 帯域（例: [45°,135°]）なら拒否。0.0で無効
    loop_closure_submap_radius: 5.0 # ループ検証時の候補サブマップ合成半径 [m]
    loop_closure_max_score: 0.0 # ループ辺のスコア上限 (ICP:平均点対線残差[m] / NDT:平均負対数尤度)。0.0で無効

    # GNSS 拘束設定（use_gnss: true のとき使用）
    use_gnss: true
    gnss_mode: gnss_anchored # "batch" | "gnss_anchored"
    gnss_topic: /gps/fix
    gnss_noise_xy_m: 3.0 # GNSS 位置ノイズ [m]。position_covariance が不定の場合のフォールバック値
    gnss_aligner: precision_weighted # "kinematic_heading" | "precision_weighted"
    kinematic_min_speed_ms: 0.5 # GNSS アライナーが有効とみなす最小移動速度 [m/s]
    gnss_max_time_delta_s: 5.0 # GNSS 測位とノードのタイムスタンプ差上限 [s]。超えた測位は拘束として使用しない
    gnss_source_type: navpvt # "navsat_fix" | "navpvt"
    # gnss_source_type: navsat_fix # "navsat_fix" | "navpvt"
    gnss_navpvt_topic: /navpvt # gnss_source_type: navpvt のとき使用するトピック
    navpvt_hacc_scale: 1.0 # NavPVT h_acc → pos_std 変換スケール。実機キャリブレーション用

    # gnss_mode: gnss_anchored のとき使用するパラメータ
    gnss_init_distance_m: 2.0 # 初期方位推定に必要な最小移動距離 [m]
    gnss_anchor_min_fix_status: 0 # アンカー採用最小fixステータス
    gnss_anchor_sigma_m: 0.05 # ノード0のxy拘束σ [m]
    gnss_init_yaw_sigma_rad: 10.0 # ノード0のyaw拘束σ [rad]
    gnss_fix_sigma_m: 0.02 # 高精度fix時のGNSS拘束σ [m]
    gnss_float_sigma_m: 0.5 # 低精度fix時のGNSS拘束σ [m]
    gnss_factor_yaw_variance: 100000000.0 # GNSS Priorのyaw分散 [rad^2]
    isam2_relinearize_threshold: 0.1 # iSAM2再線形化閾値
    gnss_max_sigma_m: 5.0 # h_acc 由来のσ上限 [m]。これを超える測位は拘束をスキップ
    gnss_rerender_threshold_m: 0.1 # GNSS拘束再描画閾値 [m]. これを超える位置変化があったときにGNSS拘束を再描画
    gnss_optimizer: gtsam # "isam2" | "gtsam"

slam_gnss_2d_offline_node:
  ros__parameters:
    offline_step_hz: 0.0 # 可視化速度 [Hz]。0 以下で最大速度

