slam_gnss_2d_node:
  ros__parameters:
    scan_topic: /scan_top_lidar
    odom_topic: /odom
    map_resolution: 0.05
    map_expansion_margin: 100.0
    min_translation: 0.3
    min_rotation: 0.1
    map_publish_hz: 1.0
    pose_graph_builder: scan_matching # "odom_only" | "scan_matching"
    icp_max_iterations: 30
    icp_tolerance: 0.0001
    icp_max_correspondence_dist: 0.5
