/**:
  ros__parameters:
    topics:
      scan: "/scan_top_lidar"
      odom: "/odom"

    map:
      resolution: 0.05
      expansion_margin: 100.0
      publish_hz: 1.0
      renderer: "counting" # "overwrite" | "counting"
      hit_threshold: 0.3

    keyframe:
      min_translation: 0.5
      min_rotation: 0.1

    # スキャンマッチング（フロントエンド）設定
    scan_matching:
      enabled: true
      type: "ndt" # "icp" | "ndt"
      reference: "scan_to_scan" # "scan_to_scan" | "scan_to_local_map"
      max_failure_streak: 5
      icp:
        max_iterations: 100
        tolerance: 0.00001
        max_correspondence_dist: 1.0
        robust_kernel: "huber"
        robust_kernel_scale: 0.1
      ndt:
        cell_size: 1.0
        cell_sizes: [2.0, 1.0, 0.5]
        use_bilinear: true
      csm:
        linear_search_window: 1.0
        angular_search_window: 0.5
        linear_step: 0.05
        angular_step: 0.02
      local_map:
        window: 30
        radius: 30.0

    # ループクロージャ設定
    loop_closure:
      enabled: true
      search_radius: 2.0
      min_node_gap: 50
      max_failure_streak: 3
      matcher_type: "icp"
      icp:
        max_iterations: 100
        tolerance: 0.00001
        max_correspondence_dist: 1.0
        robust_kernel: "huber"
        robust_kernel_scale: 0.1
      ndt:
        cell_size: 1.0
        cell_sizes: [2.0, 1.0, 0.5]
        use_bilinear: true
      csm:
        linear_search_window: 1.0
        angular_search_window: 0.5
        linear_step: 0.05
        angular_step: 0.02
      max_dyaw_deg: 145.0
      crossing_reject_deg: 45.0
      submap_radius: 5.0
      max_score: 0.05

    # GNSS設定
    gnss:
      enabled: true
      source: "navpvt" # "navsat_fix" | "navpvt"
      topics:
        fix: "/gps/fix"
        navpvt: "/navpvt"
      navpvt_hacc_scale: 1.0
      validation:
        max_sigma_m: 5.0
        missing_grace_frames: 30
      anchor:
        min_fix_status: 0
        sigma_m: 0.05
        init_yaw_sigma_rad: 10.0
        init_distance_m: 2.0
      sigma:
        fix_m: 0.02
        float_m: 0.5
        factor_yaw_variance: 100000000.0

    # バックエンド最適化設定
    optimization:
      backend: "gtsam" # "isam2" | "gtsam"
      incremental: true
      optimize_every_n_loops: 3
      rerender_threshold_m: 0.1
      isam2:
        relinearize_threshold: 0.1

slam_gnss_2d_offline_node:
  ros__parameters:
    offline_step_hz: 0.0 # 可視化速度 [Hz]。0 以下で最大速度

